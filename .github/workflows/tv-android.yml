# Android TV uygulaması. İmza isteğe bağlıdır; şu depo sırları tanımlıysa yapılır:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
name: tv-android

on:
  push:
    branches: [main, "feat/windows-*"]
    paths: ["tv-android/**", "tv-webos/**", ".github/workflows/tv-android.yml"]
  workflow_dispatch:
  # Sürüm iş akışı (release.yml) paketi buradan alır.
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: İmza anahtarı
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Derle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: tv-android
        run: |
          gradle testReleaseUnitTest assembleRelease --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/CouchSubs-androidtv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: couchsubs-android
          path: dist/*.apk
          if-no-files-found: error
