# iPhone/iPad uygulaması: bilgisayarın yerine telefon PS5'e bağlanır, altyazıyı okur, çevirir ve TV'ye (ya da kendi
# ekranına) gönderir. Proje dosyası XcodeGen ile üretilir: cd couchsubs-ios && xcodegen
# Remote Play kütüphanesi önce derlenmeli: scripts/build-chiaki-ios.sh (bkz. docs/ios-plan.md).
name: CouchSubs
options:
  bundleIdPrefix: com.couchsubs
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # libchiaki ve bağımlılıkları yalnız arm64 için derleniyor (cihaz ve Apple Silicon simülatörü).
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  CouchSubsCore:
    path: ../core
  RemotePlay:
    path: ../remoteplay
targets:
  CouchSubs:
    type: application
    platform: iOS
    sources:
      - CouchSubs
      # Mac uygulamasıyla ortak arayüz parçaları (tasarım değerleri, bileşenler, PSN giriş sayfası).
      - path: ../mac/CouchSubs/UI/Theme.swift
      - path: ../mac/CouchSubs/UI/Components.swift
      - path: ../mac/CouchSubs/UI/LoginWebView.swift
      # Ekran metinleri Mac uygulamasıyla aynı katalogda (Türkçe).
      - path: ../mac/CouchSubs/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ../design/tokens.json
        buildPhase: resources
    dependencies:
      - package: CouchSubsCore
      - package: RemotePlay
    info:
      path: CouchSubs/Info.plist
      properties:
        CFBundleDisplayName: CouchSubs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, tr]
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: CouchSubs connects to your PS5 and TV on the home network to read and send translated subtitles.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
    entitlements:
      path: CouchSubs/CouchSubs.entitlements
      properties:
        # PS5 ve TV'yi ağda bulmak (UDP yayını, SSDP) bu yetkiyi ister; Apple'dan ayrıca istenir
        # (developer.apple.com/contact/request/networking-multicast). Onay gelene kadar cihaz imzası için
        # bu satır kaldırılır ve PS5/TV adresi elle yazılır (docs/ios-plan.md).
        com.apple.developer.networking.multicast: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsubs.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
  CouchSubsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CouchSubsTests
    dependencies:
      - target: CouchSubs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsubs.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CouchSubs.app/CouchSubs"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CouchSubs:
    build:
      targets:
        CouchSubs: all
        CouchSubsTests: [test]
    test:
      targets:
        - CouchSubsTests
