name: CouchSubs
options:
  bundleIdPrefix: com.couchsubs
  # En eski desteklenen macOS; scripts/build-chiaki-macos.sh (MIN) ve package-mac.sh denetimiyle aynı.
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    # Evrensel uygulama: Apple Silicon ve Intel. libchiaki ve bağımlılıkları iki mimari için derlenir
    # (build-chiaki-macos.sh); Debug yalnız bu Mac'in mimarisini derler.
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
packages:
  CouchSubsCore:
    path: ../core
  RemotePlay:
    path: ../remoteplay
  # Uygulama içi güncelleme (MIT): GitHub sürümündeki appcast.xml'e bakar, imzayı doğrular.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  CouchSubs:
    type: application
    platform: macOS
    sources:
      - CouchSubs
      # Tasarım değerleri: Windows sürümüyle ortak tek kaynak.
      - path: ../design/tokens.json
        buildPhase: resources
      # TV uygulaması paketi (scripts/package-tv.sh üretir; yoksa kurulum özelliği gizlenir).
      - path: ../dist/tv-app
        type: folder
        optional: true
        buildPhase: resources
      # Samsung ve Android TV kurulum yardımcısı (scripts/build-tv-helper.sh üretir, package-mac.sh imzalar).
      - path: ../dist/tv-helper/couchsubs-tv-helper
        optional: true
        buildPhase:
          copyFiles:
            destination: executables
      # Türkçe dublajın ses motoru (scripts/fetch-pocket-tts.sh indirir, package-mac.sh imzalar).
      - path: ../dist/tts/pocket-tts
        optional: true
        buildPhase:
          copyFiles:
            destination: executables
    dependencies:
      - package: CouchSubsCore
      - package: RemotePlay
      - package: Sparkle
    info:
      path: CouchSubs/Info.plist
      properties:
        CFBundleDisplayName: CouchSubs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: CouchSubs finds your PS5 and TV on the local network to send translated subtitles.
        NSHumanReadableCopyright: AGPL-3.0. Uses chiaki-ng (AGPL-3.0).
        # Sparkle: güncellemeler en son GitHub sürümündeki appcast.xml'den okunur, bu anahtarla imzalanmış olmalı
        # (özel anahtar depoda değil; scripts/package-mac.sh imzalar).
        SUFeedURL: https://github.com/yorulmazsinan/couchsubs/releases/latest/download/appcast.xml
        SUPublicEDKey: GRsdOlnDQSm2yPnUTF/VoD/0202u2J0GPmJ8CCzVdfc=
        SUEnableAutomaticChecks: true
        # Uygulama uzun süre açık kalınca da yeni sürüm görünsün: saatte bir.
        SUScheduledCheckInterval: 3600
    entitlements:
      path: CouchSubs/CouchSubs.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsubs.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CouchSubsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CouchSubsTests
    dependencies:
      - target: CouchSubs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsubs.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CouchSubs.app/Contents/MacOS/CouchSubs"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CouchSubs:
    build:
      targets:
        CouchSubs: all
        CouchSubsTests: [test]
    test:
      targets:
        - CouchSubsTests
