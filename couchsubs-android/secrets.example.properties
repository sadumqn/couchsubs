# Bu dosyayı secrets.properties adıyla kopyalayıp doldurun (secrets.properties depoya girmez). CI'da aynı adlar ortam
# değişkeni olarak da verilebilir: PACKS_URL, FACEBOOK_APPID, FACEBOOK_CLIENTTOKEN.
# Boş bırakılan alan: ilgili özellik kapalı kalır (packs.url boşsa yayın adresi couchsubs-packs.enmera.workers.dev kullanılır).

# server/packs Worker'ının adresi, ör. https://couchsubs-packs.<hesap>.workers.dev
packs.url=
# Yedek adres: workers.dev'e ulaşılamazsa (ağ hatası/zaman aşımı/5xx) denenir; boşsa couchsubs-packs.enmeraapps.com
packs.fallbackUrl=
# Paket isteklerinin imza sırrı (server/packs). Boşsa ~/.config/couchsubs/packs.env içindeki PACKS_APP_SECRET; o da yoksa
# paket indirme kapalı. CI'da ortam değişkeni PACKS_APP_SECRET.
packs.app.secret=
# Meta for Developers › uygulama › Ayarlar › Temel: Uygulama Kimliği ve Gelişmiş › İstemci tokeni
facebook.appId=
facebook.clientToken=
