org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Yerel kütüphanenin derlendiği işlemci mimarileri (virgülle). armeabi-v7a: 32 bit Android çalıştıran telefon ve
# tabletler (ör. Galaxy Tab A, bazı Galaxy A/M); yoksa Play bunlara "cihazınız uyumlu değil" der. Play AAB'yi mimariye
# göre böler, kullanıcı yalnız kendi mimarisini indirir. Öykünücü için x86_64 eklenebilir; her mimari OpenSSL'i ayrıca derler.
couchsubs.abis=arm64-v8a,armeabi-v7a
